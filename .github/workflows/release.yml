# Builds TeleFilter.exe on GitHub's own Windows machine, from the code in this repo,
# and publishes it with a signed build-provenance attestation.
#
#   Publish a release:  git tag v1.0.0 && git push origin v1.0.0
#   Test the build only: Actions tab -> "Release" -> Run workflow (nothing is published)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # lets the attestation be signed as this workflow
      attestations: write    # stores the attestation
    steps:
      # Third-party actions are pinned to full commit hashes so they cannot change under us.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build TeleFilter.exe
        run: >
          python -m PyInstaller --noconfirm --clean --noconsole --name TeleFilter
          --icon TeleFilter.ico --add-data "ui/assets;ui/assets" main.py

      - name: Check the build contains no credentials or sessions
        run: |
          $bad = Get-ChildItem dist -Recurse -Include user_config.json,*.session
          if ($bad) { $bad | ForEach-Object { Write-Error "Found $($_.FullName)" }; exit 1 }
          Write-Host "OK: no user_config.json or .session files in the build"

      - name: Zip the build
        run: Compress-Archive -Path dist\TeleFilter -DestinationPath TeleFilter-win64.zip

      - name: Write SHA-256 checksum
        run: |
          $h = (Get-FileHash TeleFilter-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  TeleFilter-win64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: TeleFilter-win64.zip
          create-storage-record: false

      # Manual test runs: keep the files for download from the run page (no release is created).
      - name: Keep the files from a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TeleFilter-win64
          path: |
            TeleFilter-win64.zip
            SHA256SUMS.txt

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          @"
          ## TeleFilter $env:TAG

          Built by GitHub Actions from commit ``$env:COMMIT`` (workflow: ``.github/workflows/release.yml``).

          ### Verify your download

          1. Check the file is the one this workflow built (needs the GitHub CLI, https://cli.github.com):

             ``gh attestation verify TeleFilter-win64.zip --repo $env:REPO``

          2. Optional: compare the SHA-256 hash with ``SHA256SUMS.txt``:

             ``Get-FileHash TeleFilter-win64.zip -Algorithm SHA256``

          Only download from this Releases page. Unzip the whole folder and run ``TeleFilter.exe``.
          "@ | Out-File -Encoding utf8 release-notes.md
          gh release create $env:TAG TeleFilter-win64.zip SHA256SUMS.txt --repo $env:REPO --title "TeleFilter $env:TAG" --notes-file release-notes.md
